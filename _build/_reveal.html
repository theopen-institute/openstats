<script>
  (function () {
    const STORED = "data-fragment-toggle-stored";

    function inScrollView() {
      // Scroll view sets this class on the viewport element
      const vp = document.querySelector(".reveal-viewport");
      return !!vp && vp.classList.contains("reveal-scroll");
    }

    function storeFragmentState(el) {
      if (el.hasAttribute(STORED)) return;
      el.setAttribute(
        STORED,
        JSON.stringify({
          className: el.className,
          idx: el.getAttribute("data-fragment-index"),
          disabled: el.classList.contains("disabled")
        })
      );
    }

    function disableFragmentDOM() {
      // Remove actual fragment markers so Scroll View stops allocating extra height
      document.querySelectorAll(".reveal .fragment").forEach((el) => {
        storeFragmentState(el);
        el.classList.remove("fragment");
        el.removeAttribute("data-fragment-index");
        el.classList.remove("current-fragment", "visible");
      });
    }

    function enableFragmentDOM() {
      // Restore fragment markers exactly as they were
      document.querySelectorAll(".reveal [" + STORED + "]").forEach((el) => {
        try {
          const data = JSON.parse(el.getAttribute(STORED));
          el.className = data.className;
          if (data.idx != null) el.setAttribute("data-fragment-index", data.idx);
          // Ensure disabled state is preserved if it was present when stored
          if (data.disabled) el.classList.add("disabled");
        } catch (e) {
          // ignore
        }
      });

      // Store any fragments that might have been introduced later (e.g., dynamic content)
      document.querySelectorAll(".reveal .fragment").forEach(storeFragmentState);
    }

    function patchScrollViewFragmentCounting() {
      // reveal.js exposes the controller as Reveal.scrollView in v5+
      const sv = window.Reveal && Reveal.scrollView;
      if (!sv || sv.__patchedFragmentCounting) return;
      if (typeof sv.createFragmentTriggersForPage !== "function") return;

      sv.__patchedFragmentCounting = true;

      // Patch: ignore fragments that are dynamically disabled via class `.disabled`
      sv.createFragmentTriggersForPage = function (page, slideElement) {
        slideElement = slideElement || page.slideElement;
        page.scrollTriggers = page.scrollTriggers || [];

        const fragmentGroups = this.Reveal.fragments.sort(
          slideElement.querySelectorAll(".fragment:not(.disabled)"),
          true
        );

        if (fragmentGroups.length) {
          page.fragments = this.Reveal.fragments.sort(
            slideElement.querySelectorAll(".fragment:not(.disabled)")
          );

          page.scrollTriggers.push({
            activate: () => {
              this.Reveal.fragments.update(-1, page.fragments, slideElement);
            },
          });

          fragmentGroups.forEach((fragments, i) => {
            page.scrollTriggers.push({
              activate: () => {
                this.Reveal.fragments.update(i, page.fragments, slideElement);
              },
            });
          });
        }

        return page.scrollTriggers.length;
      };
    }

    function applyFragments(enabled) {
      // 1) Toggle Reveal stepping behavior
      Reveal.configure({ fragments: enabled, incremental: enabled });

      // 2) Toggle DOM markers to fix Scroll View spacing
      //    - When OFF: remove `.fragment` so Scroll View can't allocate fragment height
      //    - When ON: restore `.fragment` and indices
      if (enabled) {
        enableFragmentDOM();
      } else {
        // Alternative path if you prefer: keep `.fragment` but disable them:
        // document.querySelectorAll(".reveal .fragment").forEach(el => el.classList.add("disabled"));
        // (Your scrollview patch would then exclude them.)
        // However removing `.fragment` is the most reliable for eliminating spacing.
        disableFragmentDOM();
      }

      // 3) Recompute + relayout so Scroll View rebuilds triggers/space
      if (typeof Reveal.syncFragments === "function") Reveal.syncFragments();
      if (typeof Reveal.layout === "function") Reveal.layout();
      if (typeof Reveal.sync === "function") Reveal.sync();

      // If turning fragments off, reveal all on current slide
      if (!enabled) {
        const i = Reveal.getIndices();
        Reveal.slide(i.h, i.v, Number.MAX_SAFE_INTEGER);
      }
    }

    function addControls() {
      const sidebar = document.querySelector(".slide-menu-panel");
      if (!sidebar) return;

      // Patch once controls are being added (Reveal is ready)
      patchScrollViewFragmentCounting();

      const box = document.createElement("div");
      box.style.padding = "0.5rem 0.75rem";
      box.style.borderTop = "1px solid #ccc";
      box.innerHTML = `
        <label style="display:block; font-size:0.85rem;">
          <input type="checkbox" id="toggleFragments">
          Incremental Build
        </label>
        <label style="display:block; font-size:0.85rem;">
          <input type="checkbox" id="toggleTransitions" checked>
          Transitions
        </label>
      `;
      sidebar.appendChild(box);

      const frag = box.querySelector("#toggleFragments");
      const trans = box.querySelector("#toggleTransitions");

      // Capture fragment state early so re-enabling restores correctly
      document.querySelectorAll(".reveal .fragment").forEach(storeFragmentState);

      // Initialize checkbox to current config (and fix scroll spacing on load)
      try {
        const cfg = Reveal.getConfig();
        frag.checked = !!cfg.fragments;

        // If config says fragments are off, remove fragment DOM markers immediately
        // so Scroll View doesn't allocate dead-scroll space.
        if (cfg.fragments === false) {
          disableFragmentDOM();
          if (typeof Reveal.syncFragments === "function") Reveal.syncFragments();
          if (typeof Reveal.layout === "function") Reveal.layout();
          if (typeof Reveal.sync === "function") Reveal.sync();
        }
      } catch (e) { }

      frag.addEventListener("change", () => {
        applyFragments(frag.checked);

        // If we're in scroll view, layout already called in applyFragments(),
        // but leaving this is harmless.
        if (inScrollView()) {
          Reveal.layout();
        }
      });

      trans.addEventListener("change", () => {
        if (trans.checked) {
          Reveal.configure({ transition: "slide", backgroundTransition: "slide" });
        } else {
          Reveal.configure({ transition: "none", backgroundTransition: "none" });
        }
      });

      // Optional: expose to your own UI as well
      window.setFragmentsEnabled = applyFragments;
    }

    if (window.Reveal) {
      Reveal.on("ready", addControls);
    } else {
      document.addEventListener("DOMContentLoaded", addControls);
    }
  })();
</script>
