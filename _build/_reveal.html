<script>
  (function () {
    const STORED = "data-fragment-toggle-stored";

    function inScrollView() {
      // Scroll view sets this class on the viewport element
      const vp = document.querySelector(".reveal-viewport");
      return !!vp && vp.classList.contains("reveal-scroll");
    }

    function storeFragmentState(el) {
      if (el.hasAttribute(STORED)) return;
      el.setAttribute(
        STORED,
        JSON.stringify({
          className: el.className,
          idx: el.getAttribute("data-fragment-index"),
          disabled: el.classList.contains("disabled")
        })
      );
    }

    function disableFragmentDOM() {
      // Remove actual fragment markers so Scroll View stops allocating extra height
      document.querySelectorAll(".reveal .fragment").forEach((el) => {
        storeFragmentState(el);
        el.classList.remove("fragment");
        el.removeAttribute("data-fragment-index");
        el.classList.remove("current-fragment", "visible");
      });
    }

    function enableFragmentDOM() {
      // Restore fragment markers exactly as they were
      document.querySelectorAll(".reveal [" + STORED + "]").forEach((el) => {
        try {
          const data = JSON.parse(el.getAttribute(STORED));
          el.className = data.className;
          if (data.idx != null) el.setAttribute("data-fragment-index", data.idx);
          // Ensure disabled state is preserved if it was present when stored
          if (data.disabled) el.classList.add("disabled");
        } catch (e) {
          // ignore
        }
      });

      // Store any fragments that might have been introduced later (e.g., dynamic content)
      document.querySelectorAll(".reveal .fragment").forEach(storeFragmentState);
    }

    function patchScrollViewFragmentCounting() {
      // reveal.js exposes the controller as Reveal.scrollView in v5+
      const sv = window.Reveal && Reveal.scrollView;
      if (!sv || sv.__patchedFragmentCounting) return;
      if (typeof sv.createFragmentTriggersForPage !== "function") return;

      sv.__patchedFragmentCounting = true;

      // Patch: ignore fragments that are dynamically disabled via class `.disabled`
      sv.createFragmentTriggersForPage = function (page, slideElement) {
        slideElement = slideElement || page.slideElement;
        page.scrollTriggers = page.scrollTriggers || [];

        const fragmentGroups = this.Reveal.fragments.sort(
          slideElement.querySelectorAll(".fragment:not(.disabled)"),
          true
        );

        if (fragmentGroups.length) {
          page.fragments = this.Reveal.fragments.sort(
            slideElement.querySelectorAll(".fragment:not(.disabled)")
          );

          page.scrollTriggers.push({
            activate: () => {
              this.Reveal.fragments.update(-1, page.fragments, slideElement);
            },
          });

          fragmentGroups.forEach((fragments, i) => {
            page.scrollTriggers.push({
              activate: () => {
                this.Reveal.fragments.update(i, page.fragments, slideElement);
              },
            });
          });
        }

        return page.scrollTriggers.length;
      };
    }

    function applyFragments(enabled) {
      // Capture where we are before changing anything
      const i = Reveal.getIndices();
      const currentSlide = Reveal.getCurrentSlide();

      // 1) Toggle Reveal stepping behavior
      Reveal.configure({ fragments: enabled });

      // 2) Toggle DOM markers to fix Scroll View spacing
      if (enabled) {
        enableFragmentDOM();

        // IMPORTANT: when re-enabling, clear any stale "already revealed" state
        // (otherwise next slides can look fully built until a navigation occurs)
        document.querySelectorAll(".reveal .fragment").forEach((el) => {
          el.classList.remove("visible", "current-fragment");
        });
      } else {
        disableFragmentDOM();
      }

      // 3) Recompute + relayout so Scroll View rebuilds triggers/space
      if (typeof Reveal.syncFragments === "function") Reveal.syncFragments();
      if (typeof Reveal.layout === "function") Reveal.layout();
      if (typeof Reveal.sync === "function") Reveal.sync();

      // 4) Reset slide state immediately
      if (enabled) {
        // Force "start of slide" (no fragments visible)
        // Using Reveal.slide ensures Reveal updates internal fragment state too.
        Reveal.slide(i.h, i.v, -1);

        // Also explicitly update fragments on the current slide right now
        // (helps avoid needing forward/back to get incremental behavior)
        try {
          const frags = Reveal.fragments.sort(
            currentSlide.querySelectorAll(".fragment"),
            false
          );
          Reveal.fragments.update(-1, frags, currentSlide);
        } catch (e) { }
      } else {
        // Force "end of slide" (everything visible)
        Reveal.slide(i.h, i.v, Number.MAX_SAFE_INTEGER);
      }
    }

    function controlsHTML() {
      return `
        <label>
          <input type="checkbox" class="toggle-fragments">
          Incremental Build
        </label>
        <label>
          <input type="checkbox" class="toggle-transitions" checked>
          Animated Transitions
        </label>
      `;
    }

    // Footnotes appear with the text they belong to. Quarto writes each reference as a
    // bare <sup>N</sup> and the notes as a numbered list at the bottom of the slide.
    // Mark each reference .footnote-ref (styled in deck.scss), and when it sits inside
    // a fragment, make its note a fragment with the same index. Reveal only numbers a
    // slide's fragments when it visits the slide, so number them here first.
    function syncFootnoteFragments() {
      document.querySelectorAll(".reveal .slides section").forEach((slide) => {
        const notes = slide.querySelectorAll(":scope > aside ol.aside-footnotes > li");
        if (!notes.length) return;
        Reveal.syncFragments(slide);
        let changed = false;
        const sups = [...slide.querySelectorAll("sup")].filter((s) => !s.closest("aside"));
        notes.forEach((note, i) => {
          const ref = sups.find((s) => s.textContent.trim() === String(i + 1));
          if (!ref) return;
          ref.classList.add("footnote-ref");
          const frag = ref.closest(".fragment");
          if (!frag || !frag.hasAttribute("data-fragment-index")) return;
          note.classList.add("fragment");
          note.setAttribute("data-fragment-index", frag.getAttribute("data-fragment-index"));
          changed = true;
        });
        if (changed) Reveal.syncFragments(slide);
      });
    }

    function addControls() {
      syncFootnoteFragments();

      // Patch once controls are being added (Reveal is ready)
      patchScrollViewFragmentCounting();

      // Same controls in two places: the slide menu sidebar, and the bottom-left
      // corner of the title slide. All copies stay in sync.
      const sidebar = document.querySelector(".slide-menu-panel");
      if (sidebar) {
        const box = document.createElement("div");
        box.className = "deck-toggles deck-toggles-menu";
        box.innerHTML = controlsHTML();
        sidebar.appendChild(box);
      }

      const corner = document.createElement("div");
      corner.className = "deck-toggles deck-toggles-title";
      corner.innerHTML = controlsHTML();
      document.body.appendChild(corner);

      const fragBoxes = () => document.querySelectorAll(".toggle-fragments");
      const transBoxes = () => document.querySelectorAll(".toggle-transitions");

      // Show the corner copy only on the first slide
      function updateCorner() {
        const i = Reveal.getIndices();
        corner.classList.toggle("visible", i.h === 0 && (i.v || 0) === 0);
      }
      Reveal.on("slidechanged", updateCorner);
      updateCorner();

      // Capture fragment state early so re-enabling restores correctly
      document.querySelectorAll(".reveal .fragment").forEach(storeFragmentState);

      // Initialize checkboxes to current config (and fix scroll spacing on load)
      try {
        const cfg = Reveal.getConfig();
        fragBoxes().forEach((el) => (el.checked = !!cfg.fragments));

        // If config says fragments are off, remove fragment DOM markers immediately
        // so Scroll View doesn't allocate dead-scroll space.
        if (cfg.fragments === false) {
          disableFragmentDOM();
          if (typeof Reveal.syncFragments === "function") Reveal.syncFragments();
          if (typeof Reveal.layout === "function") Reveal.layout();
          if (typeof Reveal.sync === "function") Reveal.sync();
        }
      } catch (e) { }

      fragBoxes().forEach((frag) =>
        frag.addEventListener("change", () => {
          fragBoxes().forEach((el) => (el.checked = frag.checked));
          applyFragments(frag.checked);

          // If we're in scroll view, layout already called in applyFragments(),
          // but leaving this is harmless.
          if (inScrollView()) {
            Reveal.layout();
          }
        })
      );

      // Restore whatever the deck configured (_quarto.yml) when re-enabled
      const { transition, backgroundTransition } = Reveal.getConfig();
      transBoxes().forEach((trans) =>
        trans.addEventListener("change", () => {
          transBoxes().forEach((el) => (el.checked = trans.checked));
          if (trans.checked) {
            Reveal.configure({ transition, backgroundTransition });
          } else {
            Reveal.configure({ transition: "none", backgroundTransition: "none" });
          }
        })
      );

    }

    if (window.Reveal) {
      Reveal.on("ready", addControls);
    } else {
      document.addEventListener("DOMContentLoaded", addControls);
    }
  })();
</script>
