project:
  type: website
  # Ends in ".nosync" so iCloud Drive doesn't sync it. (A symlink here doesn't last:
  # a full render deletes the output dir and recreates it as a real directory.)
  output-dir: .output.nosync
  render:
    - "**/*.qmd"
    - "!notes/**"
  # Copied as-is into the site. Anchored with a leading "/" so they only match at
  # the project root, not inside .output.nosync, which Quarto would otherwise copy
  # into itself on every render. (css/deck.scss is compiled into the theme and
  # notes/ is read at render time, so neither is copied.)
  resources:
    - /images/
    - /js/
engine: knitr
execute:
  freeze: auto
format:
  revealjs:
    theme: [simple, css/deck.scss]
    logo: 'images/logo_compact_blue.svg'
    background-image: "images/background.svg"
    background-size: "cover"
    include-after-body: _build/_reveal.html
    template-partials:
      - _build/title-slide.html
    title-footer: "The Open Institute For Social Science"
    margin: 0.05
    width: 1605
    height: 1050
    chalkboard: true
    multiplex: false
    transition: slide
    background-transition: fade # only real background changes fade (e.g. into a mechanics slide)
    fragments: true
    incremental: true
  html:
    code-fold: true
    code-summary: "Show code"
    toc: true
    toc-location: left
    toc-title: "Contents"
    toc-expand: true
filters:
  - shinylive
  - _build/notes.lua
  - _build/list-fragments.lua