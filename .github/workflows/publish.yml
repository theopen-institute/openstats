name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install + cache R packages (no renv)
      - name: Install R dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            posit-dev/r-shinylive
            tidyverse
            rmarkdown
            knitr
            ggplot2
            DT
            munsell

      - name: Install Quarto shinylive extension
        run: quarto add quarto-ext/shinylive --no-prompt

      # Ensure the newest Shinylive assets bundle is used (this drives the bundled webR version)
      - name: Use latest Shinylive assets
        run: |
          TAG=$(curl -s https://api.github.com/repos/posit-dev/shinylive/releases/latest | python3 -c "import sys, json; print(json.load(sys.stdin)['tag_name'])")
          echo "SHINYLIVE_ASSETS_VERSION=$TAG" >> $GITHUB_ENV

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHINYLIVE_ASSETS_VERSION: ${{ env.SHINYLIVE_ASSETS_VERSION }}