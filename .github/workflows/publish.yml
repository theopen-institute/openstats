name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pinned versions: bump these deliberately, together with your local install.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      # Install + cache R packages
      - name: Install R dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            shinylive
            rmarkdown
            knitr
            glue
            kableExtra
            rlang
            tidyverse
            stan-dev/cmdstanr
            posterior
            tidybayes
            bayesplot
          cache-version: 1

      # CmdStan is cached by version and only built when the cache misses.
      # (ubuntu-latest already has the C++ toolchain CmdStan needs.)
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: ${{ runner.os }}-cmdstan-2.37.0

      - name: Install CmdStan
        run: |
          Rscript -e 'if (!dir.exists("~/.cmdstan/cmdstan-2.37.0")) cmdstanr::install_cmdstan(version = "2.37.0", cores = 2)'

      # Install Quarto extensions at runtime (not committed to repo)
      - name: Install Quarto shinylive extension
        run: quarto add quarto-ext/shinylive@v0.2.0 --no-prompt

      # freeze: auto only notices edits to a page's own .qmd. Fail if a page's other
      # inputs (sourced R, models, data, includes) changed since it was last frozen,
      # instead of publishing stale output. Fix: run `Rscript _build/freeze.R` locally.
      - name: Check that frozen pages are up to date
        run: Rscript _build/freeze.R --check

      - name: Create the Stan model cache directory
        run: mkdir -p .stancache

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
