name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      # Install + cache R packages
      - name: Install R dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            shinylive
            rmarkdown
            knitr
            tidyverse
            tidybayes
            posterior
            stan-dev/cmdstanr
          cache-version: 1

      # System toolchain required for CmdStan
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gfortran

      # Cache CmdStan between runs
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: ${{ runner.os }}-cmdstan

      - name: Install CmdStan
        run: Rscript -e "cmdstanr::install_cmdstan()"

      # Install Quarto extensions at runtime (not committed to repo)
      - name: Install Quarto shinylive extension
        run: quarto add quarto-ext/shinylive --no-prompt

      - name: Install Quarto code embed extension
        run: quarto add quarto-ext/include-code-files --no-prompt
        
      - name: Ensure cache directories exists
        run: |
          mkdir -p .stancache
          mkdir -p .output

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}